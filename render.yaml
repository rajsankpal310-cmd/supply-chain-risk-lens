services:
  - type: web
    name: nexus-cfr-backend
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
